<!DOCTYPE html>
<html>
<head>
    <title>Convert SVG to Favicon</title>
</head>
<body>
    <svg id="favicon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
        <rect width="64" height="64" fill="#7a9f7a"/>
        <text x="50%" y="60%" font-size="32" font-weight="bold" text-anchor="middle" fill="white">G</text>
    </svg>
</body>
</html>
